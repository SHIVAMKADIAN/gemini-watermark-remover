# Single-node CPU deployment (classical backends). Build context is the repo
# root so the sibling vidfill/ package is available to the Dockerfile.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      WM_DATA_DIR: /data
      WM_QUEUE_BACKEND: memory
      WM_WORKER_CONCURRENCY: "2"
      WM_IMAGE_BACKEND: auto
      WM_VIDEO_BACKEND: auto
    volumes:
      - wm-data:/data

  # To scale out: set WM_QUEUE_BACKEND=redis, add a redis service, and run the
  # worker as a separate replicated service sharing the same volume + redis.
  # redis:
  #   image: redis:7-alpine

volumes:
  wm-data:
