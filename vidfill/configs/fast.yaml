# Fast preset: 432p, homography-only flow (no RAFT/completion), short windows.
# Good for a quick pass on static/pan-camera footage.

inference:
  resolution: 432
  window: 24
  overlap: 6

mask:
  dilate_radius: 6
  median_window: 1
  feather_radius: 3

flow:
  estimator: homography     # classical fast path only — no GPU needed
  homography_residual_gate: 2.0

completion:
  enabled: false            # skip the learned completion net

propagation:
  max_hops: 40
  probe_offsets: [1, 2, 4, 8, 16]
  poisson_seam_blend: true

synthesis:
  model: lama               # per-frame residual only; flagged non-permissive in NOTICE
  attention_window: 12
