# vidfill default configuration.
# Balanced quality/speed. See fast.yaml and quality.yaml for the presets called
# out in the spec.

inference:
  resolution: 512        # long-side px for the learned stages (upsample masked region only)
  window: 40             # frames per chunk
  overlap: 8             # crossfaded frames between chunks

mask:
  dilate_radius: 6       # 5–10px; stops edge pixels of the removed object contaminating the fill
  median_window: 1       # >1 only for jittery/near-static masks (erodes moving masks otherwise)
  feather_radius: 3      # composite edge softness

flow:
  estimator: raft        # raft | homography (homography = classical fast path, no GPU)
  raft_iters: 20
  raft_scale: 0.25       # compute at 1/4 res, convex-upsample
  homography_residual_gate: 1.5   # px; below this, trust the fast path outright

completion:
  enabled: true
  edge_constrained: true

propagation:
  max_hops: 60           # cap chain length; beyond this, route to synthesis
  probe_offsets: [1, 2, 4, 8, 16, 32]   # strided reference probing before linear scan
  poisson_seam_blend: true

synthesis:
  model: sparse_attention   # sparse_attention | lama (M1, non-permissive; see NOTICE)
  attention_window: 20
